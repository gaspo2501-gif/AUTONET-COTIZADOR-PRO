    <script>
      /* Aplica el modo oscuro antes de dibujar, para que no parpadee en blanco */
      try {
        var m = localStorage.getItem('autonet_theme_v1');
        if (m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
